<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div id=home">
                <h3>HOME</h3>
                <div class="score"><p id="home-score">12</p></div>
                <div>
                    <button class="plus-buttons" id="home-plus-one" onclick="homeAdd1()">+1</button>
                    <button class="plus-buttons" id="home-plus-two" onclick="homeAdd2()">+2</button>
                    <button class="plus-buttons" id="home-plus-three" onclick="homeAdd3()">+3</button>
                </div>
            </div>
            
            <div id="guest">
                <h3>GUEST</h3>
                <div class="score"><p id="guest-score">5</p></div>
                <div>
                    <button class="plus-buttons" id="guest-plus-one" onclick="guestAdd1()">+1</button>
                    <button class="plus-buttons" id="guest-plus-two" onclick="guestAdd1()">+2</button>
                    <button class="plus-buttons" id="guest-plus-three" onclick="guestAdd1()">+3</button>
                </div>
            </div>
        </div>
        <button id="reset-score" onclick="reset()">Reset Scores</button>
        <script src="index.js"></script>
    </body>
</html>
